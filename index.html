<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Lacaios - Plants on Fire</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e22;
            --border-color: #2e2e34;
            --text-color: #e1e1e6;
            --text-dim: #a8a8b3;
            --accent-color: #00e676;
            --cost-3: #29b6f6;
            --cost-5: #ab47bc;
            --cost-8: #ffa726;
            --tag-base: #424242;
            --tag-variant: #5c6bc0;
            --rarity-rara: #42a5f5;
            --rarity-epica: #ab47bc;
            --rarity-lendaria: #ffa726;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .controls {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1 1 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #16161a;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: bold;
            text-transform: uppercase;
        }

        select {
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #16161a;
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dim);
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #44444e;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-id {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: bold;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-cost {
            color: #000;
        }

        .badge-cost-3 { background-color: var(--cost-3); }
        .badge-cost-5 { background-color: var(--cost-5); color: #fff; }
        .badge-cost-8 { background-color: var(--cost-8); color: #000; }

        .badge-type {
            background: var(--tag-base);
            color: #fff;
        }

        .badge-variant {
            background: var(--tag-variant);
            color: #fff;
        }

        .badge-rarity {
            border: 1px solid currentColor;
            background: transparent;
        }

        .rarity-rara { color: var(--rarity-rara); }
        .rarity-epica { color: var(--rarity-epica); }
        .rarity-lendaria { color: var(--rarity-lendaria); }

        .card-effect {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #c5c5d0;
            background: #16161a;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
            flex-grow: 1;
        }

        .card-effect strong {
            color: var(--accent-color);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }
    </style>
</head>

                <option value="5">Custo 5</option>
                <option value="8">Custo 8</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterType">Tipo:</label>
            <select id="filterType">
                <option value="all">Todos</option>
                <option value="Base">Base</option>
                <option value="Variante">Variante</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterRarity">Raridade:</label>

                <option value="Rara">Rara</option>
                <option value="Épica">Épica</option>

        const cardsGrid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterCost = document.getElementById('filterCost');
        const filterType = document.getElementById('filterType');
        const filterRarity = document.getElementById('filterRarity');
        const visibleCount = document.getElementById('visibleCount');

        function renderCards() {
            const searchTerm = searchInput.value.toLowerCase();
            const costVal = filterCost.value;
            const typeVal = filterType.value;
            const rarityVal = filterRarity.value;

            let count = 0;
            cardsGrid.innerHTML = '';

            database.forEach(card => {
                const matchesSearch = card.name.toLowerCase().includes(searchTerm) || card.effect.toLowerCase().includes(searchTerm);
                const matchesCost = costVal === 'all' || card.cost.toString() === costVal;
                const matchesType = typeVal === 'all' || card.type === typeVal;
                const matchesRarity = rarityVal === 'all' || card.rarity === rarityVal;

                if (matchesSearch && matchesCost && matchesType && matchesRarity) {
                    count++;
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    
                    const rarityClass = `rarity-${card.rarity.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')}`;

                    cardEl.innerHTML = `
                        <div class="card-header">
                            <span class="card-id">#${card.id}</span>
                            <div class="badges">
                                <span class="badge badge-cost badge-cost-${card.cost}">⚡ ${card.cost}</span>
                                <span class="badge ${card.type === 'Base' ? 'badge-type' : 'badge-variant'}">${card.type}</span>
                                <span class="badge badge-rarity ${rarityClass}">${card.rarity}</span>
                            </div>
                        </div>
                        <div class="card-title">${card.name}</div>
                        <div class="card-effect">${card.effect}</div>
                    `;
                    cardsGrid.appendChild(cardEl);
                }
            });

            visibleCount.innerText = count;

            if (count === 0) {
                cardsGrid.innerHTML = `<div class="no-results">Nenhum lacaio encontrado com os filtros selecionados.</div>`;
            }
        }

        searchInput.addEventListener('input', renderCards);
        filterCost.addEventListener('change', renderCards);
        filterType.addEventListener('change', renderCards);
        filterRarity.addEventListener('change', renderCards);

        renderCards();
    </script>
